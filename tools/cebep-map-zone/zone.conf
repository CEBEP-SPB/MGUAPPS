# Зона карты на щитке для Яндекс Навигатора: ШxВ+X+Y в кадре 1088x480.
# Штатная зона Maps on cluster - 504x368+286+72. Если машина в Яндексе левее центра - X больше.
# Свою зону клади в /var/opt/cebep-map-zone/zone.local.conf (такая же строка safe=...):
# обновление тула этот файл не трогает. После правки - "Обновить" тул в Магазине и ребут головы.
safe=504x368+456+72
