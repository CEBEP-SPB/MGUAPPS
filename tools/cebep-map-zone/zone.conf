# Cluster map zone for Yandex Navigator: WxH+X+Y inside the 1088x480 frame.
# Maps on cluster's default zone is 504x368+286+72. Car left of centre in Yandex - make X bigger.
# Put your own zone into /var/opt/cebep-map-zone/zone.local.conf (the same safe=... line):
# updates of this tool do not touch that file. After editing: reinstall the tool in the Store, restart the head unit.
safe=504x368+456+72

# Zone by body. The same cluster shows the map frame at another place on a
# 3 Series than on an X4, so one zone does not centre the car everywhere. The body
# is read from the head unit coding (BAUREIHE). A body not listed gets the zone above.
# 504x368+456+72 above: centred on G02 and G06 (seen on the cars); G01, G05, G07 share their dashboards.
# 3 / 4 Series: 388 measured by an owner on a G20 M340d; not yet seen on a car in the workshop.
safe[G20 G20LCI G21 G21LCI G28 G28LCI G28BEV G22 G23 G26 G26BEV G80 G81 G82 G83]=504x368+388+72
# 8 Series: estimated from photos of a G15 (the car stood about 6 mm right of centre at 456); to be confirmed.
safe[G14 G15 G16 F93]=504x368+410+72
