# Cluster map zone for Yandex Navigator: WxH+X+Y inside the 1088x480 frame.
# Maps on cluster's default zone is 504x368+286+72. Car left of centre in Yandex - make X bigger.
# Put your own zone into /var/opt/cebep-map-zone/zone.local.conf (the same safe=... line):
# updates of this tool do not touch that file. After editing: reinstall the tool in the Store, restart the head unit.
safe=504x368+456+72

# Zone by body (since 0.5.0): a line  safe[G20 G21 ...]=WxH+X+Y  gives those bodies their own zone. The body
# is read from the head unit coding (BAUREIHE).
# 8 Series: 410. An owner of a G15 (iOS 27, current Yandex Navigator) had the car centred with 410 from
# 0.5.0 and about 6 mm right of centre with 456 from 0.5.1. One car, one phone.
# 3 / 4 Series: no line on purpose. 0.5.0 shipped 388; on a G20 in the workshop 388 put the car about
# 10 mm LEFT of centre and 456 is within a couple of mm, while another G20 owner wants 388. The phone
# moves the car too, so a body line is right only for the phones it was measured with.
safe[G14 G15 G16 F93]=504x368+410+72
