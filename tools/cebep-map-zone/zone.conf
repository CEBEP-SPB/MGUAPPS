# Cluster map zone for Yandex Navigator: WxH+X+Y inside the 1088x480 frame.
# Maps on cluster's default zone is 504x368+286+72. Car left of centre in Yandex - make X bigger.
# Put your own zone into /var/opt/cebep-map-zone/zone.local.conf (the same safe=... line):
# updates of this tool do not touch that file. After editing: reinstall the tool in the Store, restart the head unit.
safe=504x368+456+72

# Zone by body (since 0.5.0): a line  safe[G20 G21 ...]=WxH+X+Y  gives those bodies their own zone. The body
# is read from the head unit coding (BAUREIHE). No body has its own zone now: 0.5.0 shipped 388 for the
# 3 / 4 Series and 410 for the 8 Series, and on a G20 in the workshop 388 put the car about 10 mm LEFT of
# centre, while 456 is within a couple of mm there. Cars of one body disagree, so the body is not what
# moves the car; every body is back on the zone above until that is understood.
